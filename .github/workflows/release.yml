name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unpanel/web build
      - run: node scripts/bundle.mjs
      - run: node scripts/pack.mjs
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: build/RELEASE_NOTES.md
          files: build/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror packages to unpanel.codenav.dev/releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET || 'unpanel-releases' }}
        run: bash scripts/upload-mirror.sh "${GITHUB_REF_NAME#v}" build/release

  website:
    needs: package
    uses: ./.github/workflows/deploy-site.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
