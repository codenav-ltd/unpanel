name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-pty:
    uses: ./.github/workflows/native-pty.yml

  package:
    needs: native-pty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-pty-linux-*
          path: build/native
          merge-multiple: true
      - run: pnpm --filter @unpanel/web build
      - run: node scripts/bundle.mjs
      - run: node scripts/pack.mjs
      - name: Open a terminal from the x64 package
        run: |
          mkdir -p build/verify
          tar -xzf build/release/unpanel-*-linux-x64.tar.gz -C build/verify
          node scripts/check-pty.mjs build/verify
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: build/RELEASE_NOTES.md
          files: build/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror packages to unpanel.codenav.dev/releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET || 'unpanel-releases' }}
        run: bash scripts/upload-mirror.sh "${GITHUB_REF_NAME#v}" build/release

  website:
    needs: package
    uses: ./.github/workflows/deploy-site.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
