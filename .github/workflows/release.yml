name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unpanel/web build
      - run: node scripts/bundle.mjs
      - run: node scripts/pack.mjs
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: build/RELEASE_NOTES.md
          files: build/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  website:
    needs: package
    uses: ./.github/workflows/deploy-site.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
