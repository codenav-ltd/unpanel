name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-pty:
    uses: ./.github/workflows/native-pty.yml

  package:
    needs: native-pty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-pty-linux-*
          path: build/native
          merge-multiple: true
      - run: pnpm --filter @unpanel/web build
      - run: node scripts/bundle.mjs
      - run: node scripts/pack.mjs
      - run: cp build/RELEASE_NOTES.md build/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release/
          if-no-files-found: error

  # Each package opens a real terminal on its own architecture and the glibc baseline
  # before anything is published.
  verify:
    needs: package
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:11
    steps:
      # Same pinned snapshot sources as native-pty.yml.
      - run: |
          sed -i -e "/^deb /d" -e "s/^# deb /deb [check-valid-until=no] /" /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Open a terminal from the ${{ matrix.arch }} package
        run: |
          mkdir -p package
          tar -xzf release/unpanel-*-linux-${{ matrix.arch }}.tar.gz -C package
          test "$(cat package/ARCH)" = "linux-${{ matrix.arch }}"
          node scripts/check-pty.mjs package

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: build/release
      - run: mv build/release/RELEASE_NOTES.md build/RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: build/RELEASE_NOTES.md
          files: build/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror packages to unpanel.codenav.dev/releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET || 'unpanel-releases' }}
        run: bash scripts/upload-mirror.sh "${GITHUB_REF_NAME#v}" build/release

  website:
    needs: publish
    uses: ./.github/workflows/deploy-site.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
