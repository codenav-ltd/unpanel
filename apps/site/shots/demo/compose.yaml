name: shop
services:
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
  api:
    image: traefik/whoami:v1.10
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo-only
      POSTGRES_DB: shop
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
  cache:
    image: redis:7-alpine
    restart: unless-stopped
  mailer:
    image: busybox:1.36
    command: ["sh", "-c", "sleep 90; echo 'SMTP_HOST is not set' >&2; exit 1"]
    restart: "no"
volumes:
  pgdata:
